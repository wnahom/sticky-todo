<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sticky Todo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f0eb;--panel:#fff;--hover:#ede8e0;--text:#2c2c2c;--soft:#666;--faint:#999;--border:#e0d8ce;--accent:#c49a6c;--accent-light:#f0e6d8;--danger:#e74c3c;--success:#27ae60;--shadow:0 2px 12px rgba(0,0,0,.08);--radius:10px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{background:var(--bg);color:var(--text);overflow:hidden;height:100vh;-webkit-user-select:none;user-select:none}
.app{display:flex;flex-direction:column;height:100vh}

/* Header */
header{display:flex;align-items:center;height:44px;background:var(--panel);border-bottom:1px solid var(--border);padding:0 12px;cursor:default}
header .title{flex:1;font-size:14px;font-weight:600}
header .actions{display:flex;gap:4px}
header .btn{width:32px;height:32px;border:none;background:transparent;border-radius:6px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
header .btn:hover{background:var(--hover)}
header .btn.close:hover{background:#fde8e8}

/* Toolbar */
.toolbar{display:flex;align-items:center;padding:6px 12px;gap:8px}
.toolbar input[type=text]{flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;background:var(--panel);outline:none;transition:.15s}
.toolbar input[type=text]:focus{border-color:var(--accent)}
.toolbar select{padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit;background:var(--panel);cursor:pointer;outline:none}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:12px;background:var(--accent-light);color:var(--accent);font-size:11px;font-weight:600}

/* Input */
.input-area{padding:4px 12px 8px}
.input-area input{width:100%;padding:10px 14px;border:2px dashed var(--border);border-radius:var(--radius);font-size:14px;font-family:inherit;background:var(--panel);outline:none;transition:.15s}
.input-area input:focus{border-color:var(--accent);border-style:solid}
.input-area input::placeholder{color:var(--faint)}

/* List */
.list{flex:1;overflow-y:auto;padding:4px 10px 10px}
.list::-webkit-scrollbar{width:4px}
.list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;margin-bottom:4px;background:var(--panel);border-radius:var(--radius);border:1px solid transparent;transition:.15s;cursor:default;position:relative}
.item:hover{border-color:var(--border);box-shadow:var(--shadow)}
.item.done{opacity:.55}
.item.overdue{border-left:3px solid var(--danger)}
.item.highlight{animation:hl 2s ease-out}
@keyframes hl{0%,30%{background:#fef3e2;border-color:var(--accent)}100%{background:var(--panel);border-color:transparent}}

.check{width:20px;height:20px;min-width:20px;border:2px solid var(--border);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;transition:.15s;color:#fff;margin-top:2px}
.check:hover{border-color:var(--accent)}
.check.checked{background:var(--success);border-color:var(--success)}

.content{flex:1;min-width:0}
.text{font-size:14px;line-height:1.5;word-break:break-word;cursor:text}
.done .text{text-decoration:line-through;color:var(--faint)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;font-size:11px;color:var(--faint)}
.meta .due{display:inline-flex;align-items:center;gap:2px}
.meta .due.over{color:var(--danger);font-weight:600}

.actions{display:flex;gap:2px;opacity:0;transition:.15s}
.item:hover .actions{opacity:1}
.actions button{width:28px;height:28px;border:none;background:transparent;border-radius:5px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.actions button:hover{background:var(--hover)}
.actions button.del:hover{background:#fde8e8}

.edit-input{width:100%;padding:4px 8px;border:2px solid var(--accent);border-radius:5px;font-size:14px;font-family:inherit;outline:none;background:#fff}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px;color:var(--faint)}

.empty .txt{font-size:13px}

/* Tile window styles */
body.tile-mode{background:rgba(255,248,240,.92)}
.tile-header{display:flex;align-items:center;gap:4px;padding:4px 6px;border-bottom:1px solid rgba(196,154,108,.12);-webkit-app-region:drag;cursor:grab;user-select:none}
.tile-title{font-size:10px;color:var(--faint);letter-spacing:.5px}
.tile-pinbtn{width:22px;height:22px;border:none;border-radius:3px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-right:auto;transition:.12s;color:var(--accent);opacity:.4;-webkit-app-region:no-drag}
.tile-pinbtn:hover{opacity:1;background:rgba(196,154,108,.1)}
.tile-pinbtn.active{opacity:.8}
.tile-list{flex:1;overflow-y:auto;padding:2px 6px}
.tile-input{display:flex;gap:3px;padding:3px 6px;border-bottom:1px solid rgba(196,154,108,.12);-webkit-app-region:no-drag}
.tile-input input{flex:1;padding:3px 6px;border:none;border-bottom:1px solid rgba(196,154,108,.2);border-radius:0;font-size:11px;font-family:inherit;outline:none;background:transparent;color:var(--text)}
.tile-input input:focus{border-bottom-color:var(--accent);background:transparent}
.tile-input input::placeholder{color:var(--faint);font-size:10px}
.tile-add{width:22px;height:22px;border:none;border-radius:3px;font-size:14px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--accent);opacity:.5;transition:.12s}
.tile-add:hover{opacity:1;background:rgba(196,154,108,.1)}
.tile-item{display:flex;align-items:center;gap:5px;padding:4px 2px;cursor:default;font-size:12px;line-height:1.3;border-radius:3px;transition:.1s}
.tile-item:hover{background:rgba(0,0,0,.02)}
.tile-item.done{opacity:.3}
.tile-item.overdue{background:rgba(231,76,60,.04)}
.tile-check{width:12px;height:12px;min-width:12px;border:1.5px solid rgba(196,154,108,.3);border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:6px;cursor:pointer;transition:.12s;color:#fff;margin-top:0}
.tile-check:hover{border-color:var(--accent)}
.tile-check.checked{background:var(--success);border-color:var(--success)}
.tile-text{flex:1;word-break:break-word;min-width:0;color:var(--text)}
.done .tile-text{text-decoration:line-through;color:var(--faint)}
.tile-meta{font-size:9px;color:var(--faint);white-space:nowrap;margin-left:4px;opacity:.6}
.tile-meta.over{color:var(--danger);opacity:1;font-weight:600}
.tile-empty{padding:24px 10px;text-align:center;font-size:11px;color:var(--faint);opacity:.4}

/* Overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:100}
.overlay.hidden{display:none}
.panel{background:var(--panel);border-radius:12px;padding:24px;width:380px;max-width:90vw;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.panel h2{font-size:18px;margin-bottom:20px}
.row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.row label{min-width:100px;font-size:13px;color:var(--soft)}
.row input[type=text],.row input[type=date],.row input[type=time]{flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;outline:none;background:#fff;color:var(--text)}
.row input:focus{border-color:var(--accent)}
.row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.row input[type=range]{flex:1;accent-color:var(--accent)}
.range-group{display:flex;align-items:center;gap:8px;flex:1}
.range-group span{font-size:13px;min-width:30px;text-align:right;color:var(--soft)}
.hint{font-size:11px;color:var(--faint)}
.footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.btn{padding:8px 20px;border:none;border-radius:8px;font-size:13px;font-family:inherit;cursor:pointer;transition:.15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#b8895c}
.btn-secondary{background:var(--hover);color:var(--soft)}
.btn-secondary:hover{background:var(--border)}

/* Corner marks for tile */
.corner-marks{pointer-events:none;position:fixed;inset:0}
.corner-marks svg{position:absolute}
.corner-tl{top:4px;left:4px}.corner-tr{top:4px;right:4px}.corner-bl{bottom:4px;left:4px}.corner-br{bottom:4px;right:4px}

/* Tile-only: hide main-area */
body.tile-mode .hide-in-tile{display:none!important}
</style>
</head>
<body>
<!-- 主要区域 — 在 tile 模式下隐藏 -->
<div id="mainArea" class="hide-in-tile">
<div class="app">
  <header>
    <span class="title"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px;vertical-align:-3px;opacity:.6"><circle cx="12" cy="12" r="3"/><path d="M12 2v7m0 6v7"/></svg>Sticky Todo</span>
    <div class="actions">
      <button class="btn" id="btnTile" title="磁贴 (Ctrl+Shift+Space)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
      <button class="btn" id="btnSettings" title="设置"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
  </header>

  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="搜索待办...">
    <select id="filterSelect">
      <option value="all">全部</option>
      <option value="active">未完成</option>
      <option value="done">已完成</option>
      <option value="alarmed">有提醒</option>
    </select>
    <span class="badge" id="countBadge">0</span>
  </div>

  <div class="input-area">
    <input type="text" id="todoInput" placeholder="输入新待办，按 Enter 添加..." autofocus>
  </div>

  <div class="list" id="todoList"></div>
</div>
</div>

<!-- 磁贴区域 -->
<div id="tileArea" style="display:none">
  <div class="tile-header">
    <button class="tile-pinbtn" id="tilePinBtn" title="切换置顶"><svg width="10" height="10" viewBox="0 0 20 20" fill="currentColor" stroke="none"><path d="M10 1a1 1 0 0 1 .7.3l4 4a1 1 0 0 1-1.4 1.4L11 4.4V9l3 3v2H6v-2l3-3V4.4L6.7 6.7a1 1 0 1 1-1.4-1.4l4-4A1 1 0 0 1 10 1zM5 14h10v2H5v-2z"/></svg></button>
    <span class="tile-title">Sticky</span>
  </div>
  <div class="tile-input">
    <input type="text" id="tileInput" placeholder="添加待办..." />
    <button class="tile-add" id="tileAddBtn">+</button>
  </div>
  <div class="tile-list" id="tileList"></div>
</div>

<!-- 设置面板 -->
<div class="overlay hidden" id="settingsOverlay">
  <div class="panel">
    <h2>设置</h2>
    <div class="row"><label>磁贴透明度</label><div class="range-group"><input type="range" id="settingOpacity" min="0.3" max="1" step="0.05" value="0.92"><span id="opacityValue">0.92</span></div></div>
    <div class="row"><label>闹钟声音</label><input type="checkbox" id="settingAlarmSound" checked></div>
    <div class="row"><label>磁贴宽度</label><input type="range" id="settingTW" min="180" max="500" step="10" value="260"><span id="twVal" style="font-size:12px;min-width:30px;color:var(--soft)">260</span></div>
    <div class="row"><label>磁贴高度</label><input type="range" id="settingTH" min="200" max="800" step="10" value="360"><span id="thVal" style="font-size:12px;min-width:30px;color:var(--soft)">360</span></div>
    <div class="footer"><button class="btn btn-primary" id="btnCloseSettings">关闭</button></div>
  </div>
</div>

<!-- 闹钟面板 -->
<div class="overlay hidden" id="alarmOverlay">
  <div class="panel">
    <h3>设置提醒</h3>
    <div class="row"><label>截止日期</label><input type="date" id="alarmDate"></div>
    <div class="row"><label>提醒时间</label><input type="time" id="alarmTime"></div>
    <div class="row"><label>启用闹钟</label><input type="checkbox" id="alarmEnabled" checked></div>
    <div class="footer"><button class="btn btn-secondary" id="btnAlarmCancel">取消</button><button class="btn btn-primary" id="btnAlarmSave">保存</button></div>
  </div>
</div>

<script>
// ================================
// 适配层 — Electron IPC / fetch 双模式
// ================================
const api = window.electronAPI;
const isElectron = !!api;
const fetchTodos = () => isElectron ? api.todos.list() : fetch("/data").then(r => r.json());
const createTodo = text => isElectron ? api.todos.create(text) : fetch("/data",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(null)}).then(()=>{});
const updateTodo = (id,up) => isElectron ? api.todos.update(id,up) : Promise.resolve();
const deleteTodo = id => isElectron ? api.todos.delete(id) : Promise.resolve();
const toggleTodo = id => isElectron ? api.todos.toggle(id) : Promise.resolve();
const getConfig = () => isElectron ? api.config.get() : fetch("/config").then(r=>r.json());
const saveCfg = c => isElectron ? api.config.save(c) : fetch("/config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(c)});

// ================================
// 数据 & 渲染
// ================================
let todos = [];
let editingId = null, alarmTargetId = null, currentFilter = "all";

const $ = id => document.getElementById(id);
const esc = s => {const d=document.createElement("div");d.textContent=s;return d.innerHTML};
const fmt = iso => {if(!iso)return"";const d=new Date(iso);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`};
const fmtDate = iso => {if(!iso)return"";const d=new Date(iso);return `${d.getMonth()+1}/${d.getDate()}`};
const over = iso => iso && new Date(iso).getTime() < Date.now();

async function loadData() { todos = await fetchTodos(); render(); }
async function saveData() { /* 实际通过 IPC 实时保存，这里仅做同步 */ }

function getFiltered() {
  const q = $("searchInput").value.toLowerCase().trim();
  return todos.filter(t => {
    if(q && !t.text.toLowerCase().includes(q)) return false;
    if(currentFilter==="active" && t.done) return false;
    if(currentFilter==="done" && !t.done) return false;
    if(currentFilter==="alarmed" && !t.alarmEnabled) return false;
    return true;
  });
}

function render() {
  // 非 tile 模式才渲染主列表
  const isTile = document.body.classList.contains("tile-mode");
  if(!isTile) {
    const f = getFiltered();
    const act = todos.filter(t=>!t.done).length;
    $("countBadge").textContent = `${act}/${todos.length}`;
    const list = $("todoList");
    if(!f.length) { list.innerHTML=`<div class="empty"><div class="txt">${todos.length?"没有匹配的待办":"还没有待办事项"}</div></div>`; }
    else {
      list.innerHTML = f.map(t => {
        const due = t.alarmEnabled && t.alarmTime && new Date(t.alarmTime).getTime() < Date.now();
        return `<div class="item ${t.done?"done":""} ${due&&!t.done?"overdue":""}" data-id="${t.id}">
          <div class="check ${t.done?"checked":""}" data-action="toggle">${t.done?"✓":""}</div>
          <div class="content">
            <div class="text" data-action="edit">${esc(t.text)}</div>
            <div class="meta">${t.alarmEnabled&&t.alarmTime?`<span class="due ${due&&!t.done?"over":""}">${fmt(t.alarmTime)}</span>`:t.dueDate?`<span class="due ${due&&!t.done?"over":""}">${fmtDate(t.dueDate)}</span>`:""}</div>
          </div>
          <div class="actions">
            <button data-action="alarm" title="提醒"><svg width="12" height="12" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="11" r="6"/><path d="M10 8v3l2 1.5"/></svg></button>
            <button class="del" data-action="delete" title="删除"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
          </div>
        </div>`;
      }).join("");
    }
  }
  renderTile();
}

function renderTile() {
  const list = $("tileList");
  const active = todos.filter(t=>!t.done);
  const now = Date.now();
  if(!active.length) { list.innerHTML=`<div class="tile-empty">~ 全部完成 ~</div>`; return; }
  list.innerHTML = active.map(t => {
    const d = t.dueDate?new Date(t.dueDate):null;
    const dueTile = t.alarmEnabled && t.alarmTime && new Date(t.alarmTime).getTime() < now;
    const timeStr = t.alarmTime ? fmt(t.alarmTime) : "";
    const showMeta = d || t.alarmEnabled;
    return `<div class="tile-item ${t.done?"done":""} ${dueTile&&!t.done?"overdue":""}" data-id="${t.id}">
      <div class="tile-check" data-action="toggle">${t.done?"✓":""}</div>
      <span class="tile-text">${esc(t.text)}</span>
      ${showMeta?`<span class="tile-meta ${dueTile&&!t.done?"over":""}">${t.alarmEnabled&&t.alarmTime?timeStr:d?fmtDate(t.dueDate):""}</span>`:""}
    </div>`;
  }).join("");
}

// ================================
// 事件
// ================================
$("todoInput").addEventListener("keydown", async e => {
  if(e.key !== "Enter") return;
  const text = $("todoInput").value.trim();
  if(!text) return;
  const todo = { id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), text, done:false, createdAt:new Date().toISOString(), dueDate:null, alarmEnabled:false, alarmTime:null };
  todos.unshift(todo);
  $("todoInput").value = "";
  if(isElectron) await api.todos.create(text);
  else await fetch("/data",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(todos)});
  render();
});

$("todoList").addEventListener("click", async e => {
  const item = e.target.closest(".item"); if(!item) return;
  const id = item.dataset.id;
  const act = e.target.closest("[data-action]")?.dataset?.action;
  const t = todos.find(x=>x.id===id); if(!t) return;
  if(act==="toggle") { t.done=!t.done; if(isElectron) await api.todos.toggle(id); else await fetch("/data",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(todos)}); render(); }
  else if(act==="delete") { todos=todos.filter(x=>x.id!==id); if(isElectron) await api.todos.delete(id); else await fetch("/data",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(todos)}); render(); }
  else if(act==="alarm") openAlarm(id);
  else if(act==="edit") startEdit(id);
});

$("todoList").addEventListener("dblclick", e => { const i=e.target.closest(".item"); if(i) startEdit(i.dataset.id); });

// Tile input: Enter to add
// Tile pin toggle
$("tilePinBtn").addEventListener("click", async () => {
  if(isElectron) {
    const pinned = await api.tile.pin();
    $("tilePinBtn").classList.toggle("active", pinned);
  }
});

// Tile quick add
$("tileInput").addEventListener("keydown", async e => {
  if(e.key !== "Enter") return;
  await tileAddTodo();
});
$("tileAddBtn").addEventListener("click", async () => { await tileAddTodo(); });
async function tileAddTodo() {
  const text = $("tileInput").value.trim();
  if(!text) return;
  const todo = { id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), text, done:false, createdAt:new Date().toISOString(), dueDate:null, alarmEnabled:false, alarmTime:null };
  todos.unshift(todo);
  $("tileInput").value = "";
  if(isElectron) await api.todos.create(text);
  else await fetch("/data",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(todos)});
  render();
}

$("tileList").addEventListener("click", async e => {
  const item = e.target.closest(".tile-item"); if(!item) return;
  if(!e.target.closest("[data-action]")) return;
  const t = todos.find(x=>x.id===item.dataset.id); if(!t) return;
  t.done=!t.done; if(isElectron) await api.todos.toggle(t.id); else await fetch("/data",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(todos)}); render();
});

function startEdit(id) {
  if(editingId) return;
  const t = todos.find(x=>x.id===id); if(!t) return;
  editingId = id;
  const item = document.querySelector(`.item[data-id="${id}"]`); if(!item) return;
  const textEl = item.querySelector(".text");
  const inp = document.createElement("input"); inp.className="edit-input"; inp.value=t.text;
  textEl.replaceWith(inp); inp.focus(); inp.select();
  const fin = async () => { const v=inp.value.trim(); if(v&&v!==t.text){t.text=v;if(isElectron)await api.todos.update(id,{text:v});else await fetch("/data",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(todos)})} render(); editingId=null; };
  inp.addEventListener("blur",fin);
  inp.addEventListener("keydown", e => { if(e.key==="Enter") inp.blur(); if(e.key==="Escape") { render(); editingId=null; } });
}

$("searchInput").addEventListener("input", render);
$("filterSelect").addEventListener("change", () => { currentFilter=$("filterSelect").value; render(); });

// ================================
// 闹钟面板
// ================================
function openAlarm(id) {
  alarmTargetId=id; const t=todos.find(x=>x.id===id); if(!t)return;
  const now=new Date();
  $("alarmDate").value=t.alarmTime?new Date(t.alarmTime).toISOString().slice(0,10):now.toISOString().slice(0,10);
  $("alarmTime").value=t.alarmTime?`${String(new Date(t.alarmTime).getHours()).padStart(2,"0")}:${String(new Date(t.alarmTime).getMinutes()).padStart(2,"0")}`:"09:00";
  $("alarmEnabled").checked=t.alarmEnabled!==false;
  $("alarmOverlay").classList.remove("hidden");
}
$("btnAlarmSave").addEventListener("click", async () => {
  if(!alarmTargetId)return; const t=todos.find(x=>x.id===alarmTargetId); if(!t)return;
  const d=$("alarmDate").value, tm=$("alarmTime").value;
  t.dueDate=d?new Date(d+"T23:59:59").toISOString():null;
  t.alarmTime=d&&tm?new Date(d+"T"+tm+":00").toISOString():null;
  t.alarmEnabled=$("alarmEnabled").checked;
  if(isElectron) await api.todos.update(t.id,{dueDate:t.dueDate,alarmTime:t.alarmTime,alarmEnabled:t.alarmEnabled});
  else await fetch("/data",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(todos)});
  render(); $("alarmOverlay").classList.add("hidden"); alarmTargetId=null;
});
$("btnAlarmCancel").addEventListener("click",()=>{$("alarmOverlay").classList.add("hidden");alarmTargetId=null;});

// ================================
// 设置
// ================================
$("btnSettings").addEventListener("click", async () => {
  try { const c=await getConfig(); $("settingOpacity").value=c.opacity||0.92; $("opacityValue").textContent=c.opacity||0.92; $("settingAlarmSound").checked=c.alarmSound!==false; } catch {}
  $("settingsOverlay").classList.remove("hidden");
});
$("btnCloseSettings").addEventListener("click", async () => {
  await saveCfg({opacity:parseFloat($("settingOpacity").value),alarmSound:$("settingAlarmSound").checked});
  $("settingsOverlay").classList.add("hidden");
});
$("settingOpacity").addEventListener("input",()=>{$("opacityValue").textContent=$("settingOpacity").value});

// Tile toggle
$("btnTile").addEventListener("click", () => {
  if(isElectron) api.tile.toggle();
});

// ================================
// 快捷键
// ================================
document.addEventListener("keydown", e => {
  if(e.key==="Escape") document.querySelectorAll(".overlay:not(.hidden)").forEach(el=>el.classList.add("hidden"));
  if((e.ctrlKey||e.metaKey)&&e.key==="n"){e.preventDefault();$("todoInput").focus();}
});

// Close on backdrop
document.querySelectorAll(".overlay").forEach(el=>{el.addEventListener("click",e=>{if(e.target===el)el.classList.add("hidden")})});

// ================================
// 初始化 & 闹钟
// ================================
async function init() {
  // 判断是否为 tile 模式 (Electron tile window 通过 hash 判断)
  if (location.hash === "#/tile") {
    document.body.classList.add("tile-mode");
    $("mainArea").style.display = "none";
    $("tileArea").style.display = "flex";
    $("tileArea").style.flexDirection = "column";
    if(isElectron) $("tilePinBtn").classList.add("active");
  }

  await loadData();

  // 闹钟引擎（仅 Electron 后端管理，浏览器模式用前端 Notification）
  if (!isElectron && Notification.permission === "default") await Notification.requestPermission();
  if (!isElectron) {
    const notified = new Set();
    setInterval(() => {
      const now = Date.now();
      todos.forEach(t => {
        if(t.done||!t.alarmEnabled||!t.alarmTime) return;
        const ms = new Date(t.alarmTime).getTime();
        if(Math.abs(now-ms)<30000 && !notified.has(t.id)) {
          notified.add(t.id);
          try { new Notification("Sticky Todo",{body:t.text}); } catch {}
        }
      });
    }, 10000);
  }

  // Electron 数据同步事件
  if (isElectron) {
    api.onTodosChanged(newTodos => { todos = newTodos; render(); });
  }
}

init();
</script>
