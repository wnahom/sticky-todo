<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sticky</title>
<link rel="stylesheet" href="../styles/base.css">
<link rel="stylesheet" href="../styles/tile.css">
</head>
<body>

<div class="tile-shell">
  <div class="tile-header drag">
    <button class="tile-pinbtn no-drag active" id="tilePinBtn" title="切换置顶">
      <svg width="10" height="10" viewBox="0 0 20 20" fill="currentColor" stroke="none">
        <path d="M10 1a1 1 0 0 1 .7.3l4 4a1 1 0 0 1-1.4 1.4L11 4.4V9l3 3v2H6v-2l3-3V4.4L6.7 6.7a1 1 0 1 1-1.4-1.4l4-4A1 1 0 0 1 10 1zM5 14h10v2H5v-2z"/>
      </svg>
    </button>
    <span class="tile-title">Sticky</span>
  </div>

  <div class="tile-input no-drag">
    <input type="text" id="tileInput" placeholder="添加待办..." autofocus>
    <button class="tile-add" id="tileAddBtn" title="添加">+</button>
  </div>

  <div class="tile-list scroll-host" id="tileList"></div>
</div>

<script type="module" src="./tile.js"></script>
</body>
</html>
